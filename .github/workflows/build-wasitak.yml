name: Build Wasitak Android and check web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Build Android release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://xjmvzigoptweolpdsfhp.supabase.co' }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_YePsC3nUCuCKqA0Sa997Qg_IJ0eEUVW' }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasitak-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  web-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check website files exist
        run: test -s index.html && test -s README_AR.md
