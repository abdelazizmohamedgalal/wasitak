<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وسيطك — وحدات ووظائف</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="/">وسيطك <small>من بورسعيد لكل مصر</small></a><nav><a href="#browse">الإعلانات</a><a href="#auth">دخول / تسجيل</a><a href="#add">أضف إعلانك</a></nav></div></header><main class="wrap"><section class="hero"><p>الفنار • مبنى القبة • المعدية • النورس</p><h1>مكانك المناسب، <em>وفرصتك الجاية.</em></h1><p>وحدات للبيع والإيجار، ووظائف وباحثون عن عمل في مكان واحد.</p><div class="search"><input id="q" placeholder="ابحث بعنوان أو منطقة"><select id="kind"><option value="property">عقارات</option><option value="job">وظائف</option><option value="seeker">باحثون عن عمل</option></select><button id="search">بحث</button></div></section><section id="browse"><h2>أحدث الإعلانات <span id="count"></span></h2><div id="items" class="cards">جاري التحميل…</div></section><section id="auth" class="panel"><h2 id="authTitle">إنشاء حساب</h2><form id="authForm"><label id="nameLabel">الاسم<input name="name" required minlength="2"></label><label>البريد الإلكتروني<input name="email" type="email" required></label><label>كلمة السر<input name="password" type="password" minlength="10" required></label><button>إنشاء حساب</button><button type="button" class="secondary" id="toggle">لدي حساب</button><p id="authMsg"></p></form></section><section id="account" class="panel"><h2>حسابي</h2><button type="button" id="loadMine" class="secondary">عرض إعلاناتي وطلباتي</button><button type="button" id="logout" class="secondary" hidden>تسجيل الخروج</button><div id="mine"></div></section><section id="add" class="panel"><h2>أضف إعلانًا</h2><form id="addForm"><label>النوع<select name="kind"><option value="property">عقار</option><option value="job">وظيفة</option><option value="seeker">باحث عن عمل</option></select></label><label>العنوان<input name="title" minlength="4" maxlength="160" required></label><label>الوصف<textarea name="description" maxlength="5000"></textarea></label><label>المدينة<input name="city" value="بورسعيد"></label><label>المنطقة<input name="district"></label><label>وسيلة التواصل (اختياري)<input name="contact" maxlength="120" placeholder="هاتف أو بريد للتواصل"></label><label>صورة الإعلان (اختياري)<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>السيرة الذاتية PDF (اختياري للباحثين عن عمل)<input id="cvFile" type="file" accept="application/pdf"></label><button>إرسال الإعلان</button><p id="addMsg"></p></form></section></main><footer><div class="wrap">وسيطك — هوية بورسعيد وفرص لكل مصر</div></footer><script src="/app.js"></script></body></html>
